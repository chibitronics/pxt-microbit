name: Upload Website

on:
  push:
    branches:
    - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1
    - name: Install and build release
      uses: actions/setup-node@v4
      with:
        node-version: 21
    - run: npm install
    - run: npm run build
    - name: Test saved-project service and editor adapter
      run: |
        cd services/project-store
        npm ci --ignore-scripts
        npm test

    - name: Deploy static site to S3 bucket
      run: |
        aws s3 sync ./built/packaged s3://chibi-microbit --delete
        # Avoid heuristic browser caching of HTML and update manifests.
        for key in index.html serviceworker.js simulatorserviceworker.js sim.webmanifest; do
          if [ -f "./built/packaged/$key" ]; then
            aws s3 cp "./built/packaged/$key" "s3://chibi-microbit/$key" --cache-control "no-cache, max-age=0, must-revalidate" --only-show-errors
          fi
        done

    - name: Invalidate CloudFront
      run: aws cloudfront create-invalidation --distribution-id E1IKCN86TX9AGT --paths "/*"
